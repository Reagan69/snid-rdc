# Développement LOCAL uniquement : base PostgreSQL. (Vercel n'exécute pas Docker ; voir docs/vercel/deploiement.md.)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: snid
      POSTGRES_PASSWORD: snid_local_dev
      POSTGRES_DB: snid
    ports: ["5432:5432"]
    volumes: ["snid_pg:/var/lib/postgresql/data"]
volumes:
  snid_pg:
# .env local :
#   DATABASE_URL="postgresql://snid:snid_local_dev@localhost:5432/snid"
#   DIRECT_URL="postgresql://snid:snid_local_dev@localhost:5432/snid"
